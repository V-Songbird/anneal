<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Two bars for the contract characters an agent read on Claude Code with Claude Opus 5, twelve runs. With the original map file, about 123,000. With a map file that has two Start here lines, about 31,000. Both map files scored 6 of 6 correct runs, and no run loaded the plugin. It reads: Start here."><style>.bg{fill:#f2f1ec}.bg{stroke:rgba(20,20,19,.14)}.ink{fill:#161612}.mut{fill:#6d6a60}.wv{fill:#8f8b80}.el{fill:#7b4fa0}@media(prefers-color-scheme:dark){.bg{fill:#141413}.bg{stroke:#30363d}.ink{fill:#ffffff}.mut{fill:#b9b9b1}.wv{fill:#5a5a55}.el{fill:#b38cd4}}.card,.bg{fill:#fff}.ink-frame{stroke:#252820;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.seal{stroke:#252820}.seal-paper{fill:#fff}text{font-kerning:normal;text-rendering:optimizeLegibility}@media(prefers-color-scheme:dark){.card,.bg{fill:#191c1b}.ink-frame{stroke:#eee9de}.seal{stroke:#eee9de}.seal-paper{fill:#191c1b}}</style><path class="bg ink-frame" d="M12 1 Q252 -2 688 1 Q699 0 699 12 L698 288 Q700 299 688 299 Q336 302 12 299 Q1 300 1 288 L2 12 Q0 1 12 1Z"/><text class="mut" x="24" y="50" font-size="13.5">Original map file: about 123,000 contract characters read</text><rect class="wv" x="24" y="60" width="520" height="18" rx="2"/><text class="el" x="24" y="114" font-size="13.5" font-weight="700">With two Start here lines: about 31,000</text><rect class="el" x="24" y="124" width="131" height="18" rx="2"/><text class="ink" x="24" y="222" font-size="54" font-weight="800" letter-spacing="-1">Start here.</text><text class="mut" x="24" y="253" font-size="16.5">Claude Opus 5 on Claude Code, 12 runs. Two contract-task runs per map file.</text><text class="mut" x="24" y="277" font-size="14">Both map files scored 6 of 6 correct. No run loaded the plugin: it compares two map files.</text><g transform="translate(628 150) rotate(-8) translate(-32 -32) scale(0.5)" aria-hidden="true"><g class="seal" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 26Q64 22 116 26L106 42 98 98Q96 112 82 112L46 112Q32 112 30 98L22 42Z" fill="#7b4fa0"/><path d="M22 42Q64 38 106 42" fill="none"/><path d="M64 52Q82 68 80 86Q78 102 64 102Q50 102 48 86Q48 74 57 65Q59 76 66 78Q70 64 64 52Z" class="seal-paper"/></g></g></svg>
