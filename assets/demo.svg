" cy="228" r="5"/><text class="ink" x="136" y="234" font-size="17" font-weight="700">A build folder shows up in searches.</text><text class="mut" x="136" y="254" font-size="14">dist/, 1 file, not ignored by git</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.420;0.438;1" dur="14s" repeatCount="indefinite"/><circle class="ac" cx="119" cy="284" r="5"/><text class="ink" x="136" y="290" font-size="17" font-weight="700">Two files share the same name.</text><text class="mut" x="136" y="310" font-size="14">src/cart/format.js and src/orders/format.js</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.550;0.568;1" dur="14s" repeatCount="indefinite"/><text class="ink" x="36" y="368" font-size="34" font-weight="800" letter-spacing="-.5">It reported. It changed no files.</text><text class="mut" x="36" y="394" font-size="14.5" font-style="italic">anneal's reply: “I changed no files and saved no report.”</text></g><text class="mut" x="36" y="432" font-size="13.5">one recorded session, Claude Opus 5.5 through the Claude Agent SDK, 2026-11-16 · 20 seconds ·</text><text class="mut" x="36" y="450" font-size="13.5">8 of 8 graders passed, among them that no file was created</text><g transform="translate(655 38) rotate(-6) translate(-20 -20) scale(0.3125)" aria-hidden="true"><g class="seal" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 26Q64 22 116 26L106 42 98 98Q96 112 82 112L46 112Q32 112 30 98L22 42Z" fill="#7b4fa0"/><path d="M22 42Q64 38 106 42" fill="none"/><path d="M64 52Q82 68 80 86Q78 102 64 102Q50 102 48 86Q48 74 57 65Q59 76 66 78Q70 64 64 52Z" class="seal-paper"/></g></g></svg>
