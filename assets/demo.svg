<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="anneal audits a repository and changes nothing. One recorded session. You asked: Before we reorganize anything: how easy is this repository for you to find your way around? List the problems you see, but don't change any files. anneal found six problems. Three of them: no map file tells an agent where things are, so every session starts by exploring; a build folder shows up in searches, dist/, 1 file, not ignored by git; two files share the same name, src/cart/format.js and src/orders/format.js. It reported. It changed no files. anneal's reply said: I changed no files and saved no report. Claude Opus 5.5 through the Claude Agent SDK, 2026-11-16, 20 seconds; 8 of 8 graders passed, among them that no file was created."><style>.card{fill:#fcfcfb;stroke:rgba(11,11,11,.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.bp{fill:#dcd9d0}.ac{fill:#7b4fa0}.pillt{fill:#52514e}.you{fill:#52514e}@media(prefers-color-scheme:dark){.card{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.ink2{fill:#b0b8c0}.mut{fill:#9198a1}.bp{fill:#3d3c37}.ac{fill:#b38cd4}.pillt{fill:#9198a1}.you{fill:#b0b8c0}}.card,.bg{fill:#fff}.ink-frame{stroke:#252820;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.seal{stroke:#252820}.seal-paper{fill:#fff}text{font-kerning:normal;text-rendering:optimizeLegibility}@media(prefers-color-scheme:dark){.card,.bg{fill:#191c1b}.ink-frame{stroke:#eee9de}.seal{stroke:#eee9de}.seal-paper{fill:#191c1b}}@media(prefers-reduced-motion:reduce){g:has(>animate[values$=";1"]){opacity:1!important}g:has(>animate[values$=";0"]){opacity:0!important}}</style><path class="card ink-frame" d="M20 7 Q254.23999999999998 4 680 7 Q691 6 691 18 L690 456 Q692 467 680 467 Q336.32 470 20 467 Q9 468 9 456 L10 18 Q8 7 20 7Z"/><text class="ink" x="36" y="42" font-size="21" font-weight="800">anneal audits a repo